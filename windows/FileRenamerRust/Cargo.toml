[package]
name = "FileRenamerRust"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_xlsxwriter = "0.104"
calamine = "0.38"
md5 = "0.7"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
]

# 体积优先的 release 配置：LTO + 单代码生成单元 + 剥离符号 + panic 时直接终止
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
